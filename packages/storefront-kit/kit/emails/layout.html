<!doctype html>
<html lang="es">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title></title></head>
<body style="margin:0;padding:0;background:var(--brand-background, #f4f4f2);color:var(--brand-foreground, #18181b);font-family:Helvetica,Arial,sans-serif">
  <span data-email-preheader style="display:none;font-size:1px;line-height:1px;max-height:0;max-width:0;opacity:0;overflow:hidden;color:#f4f4f2;background:#f4f4f2"></span>
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:var(--brand-background, #f4f4f2);color:var(--brand-foreground, #18181b)">
    <tr><td align="center" style="padding:32px 16px;background:var(--brand-background, #f4f4f2)">
      <table role="presentation" width="600" cellpadding="0" cellspacing="0" style="width:100%;max-width:600px;background:var(--brand-surface, #ffffff);color:var(--brand-foreground, #18181b);border-radius:12px">
        <tr>
          <td style="padding:24px 32px 12px;background:var(--brand-surface, #ffffff)">
            <a data-store-link style="text-decoration:none;color:var(--brand-foreground, #18181b);background:var(--brand-surface, #ffffff)">
              <img data-store-logo width="48" alt="" style="display:block;border:0;margin:0 0 8px">
              <span data-store-name style="font-size:13px;font-weight:bold;letter-spacing:.12em;text-transform:uppercase;color:var(--brand-foreground, #18181b);background:var(--brand-surface, #ffffff)"></span>
            </a>
          </td>
          <td align="right" style="padding:24px 32px 12px;background:var(--brand-surface, #ffffff)">
            <a data-nav-link style="margin-left:14px;font-size:13px;text-decoration:none;color:var(--brand-foreground, #18181b);background:var(--brand-surface, #ffffff)"></a>
          </td>
        </tr>
        <tr><td colspan="2" data-email-content style="padding:8px 32px 32px;background:var(--brand-surface, #ffffff)"></td></tr>
        <!-- The footer sits on the accent colour, so its social icons always use the light tone. -->
        <tr><td colspan="2" align="center" style="padding:28px 32px;border-radius:0 0 12px 12px;background:var(--brand-accent, #18181b);color:var(--brand-accent-foreground, #ffffff)">
          <p style="margin:0 0 14px;font-size:14px;font-weight:bold;letter-spacing:.12em;text-transform:uppercase;color:var(--brand-accent-foreground, #ffffff);background:var(--brand-accent, #18181b)"><span data-store-name></span></p>
          <p style="margin:0;background:var(--brand-accent, #18181b)"><a data-social style="display:inline-block;margin:0 6px;text-decoration:none;font-size:13px;color:var(--brand-accent-foreground, #ffffff);background:var(--brand-accent, #18181b)"><img data-social-icon width="24" height="24" alt="" style="display:block;border:0"></a></p>
          <p data-store-address style="margin:14px 0 0;font-size:12px;line-height:1.5;color:var(--brand-accent-foreground, #ffffff);background:var(--brand-accent, #18181b)"></p>
          <p style="margin:10px 0 0;background:var(--brand-accent, #18181b)"><a data-policy-link style="margin:0 8px;font-size:12px;color:var(--brand-accent-foreground, #ffffff);background:var(--brand-accent, #18181b)"></a></p>
        </td></tr>
      </table>
      <p style="margin:16px 0 0;font-size:12px;color:#6b6b73;background:var(--brand-background, #f4f4f2)"><a data-email-unsubscribe style="color:#6b6b73;background:var(--brand-background, #f4f4f2)">Dejar de recibir estos correos</a></p>
    </td></tr>
  </table>
</body>
</html>
