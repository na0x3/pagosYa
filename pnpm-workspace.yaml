packages:
  - "apps/*"
  - "packages/*"
overrides:
  # Pin transitive browserslist-data deps to versions old enough that a
  # supply-chain "minimum release age" check won't flag them as too-fresh.
  node-releases: "2.0.51"
  terser: "5.49.0"
  # Security floors for transitive packages still pinned by Nest 10. These
  # are compatible patch/minor releases and avoid changing framework APIs.
  body-parser: "1.20.6"
  file-type: "21.3.2"
  js-yaml: "4.3.2"
  lodash: "4.18.1"
  multer: "2.4.0"
  nanoid: "3.3.18"
  qs: "6.16.0"
  uuid: "11.1.1"
  postcss: "8.5.25"
  fast-uri: "3.1.8"
  hono: "4.13.7"
  ip-address: "10.7.2"
  # Patched development/build dependencies; keep major-specific APIs where required.
  ws: "8.21.0"
  sharp: "0.35.4"
  "undici@^7": "7.29.1"
  "esbuild@<0.25.0": "0.25.12"
  "esbuild@>=0.27.3 <0.28.1": "0.28.2"
  "image-size@^2": "2.0.3"
  "brace-expansion@^1": "1.1.21"
  "brace-expansion@^4": "5.0.12"
  "brace-expansion@^5": "5.0.12"
allowBuilds:
  '@embedded-postgres/darwin-arm64': true
  '@embedded-postgres/linux-x64': true
  '@nestjs/core': true
  '@prisma/client': true
  '@prisma/engines': true
  # Telemetry postinstall; declined deliberately (see the dev-only rail commit).
  '@scarf/scarf': false
  argon2: true
  esbuild: true
  prisma: true
  sharp: true
  workerd: true
