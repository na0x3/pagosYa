packages:
  - "apps/*"
  - "packages/*"
overrides:
  # Pin transitive browserslist-data deps to versions old enough that a
  # supply-chain "minimum release age" check won't flag them as too-fresh.
  node-releases: "2.0.51"
  terser: "5.49.0"
allowBuilds:
  '@embedded-postgres/darwin-arm64': true
  '@embedded-postgres/linux-x64': true
  '@nestjs/core': true
  '@prisma/client': true
  '@prisma/engines': true
  argon2: true
  esbuild: true
  prisma: true
