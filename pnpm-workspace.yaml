packages:
  - "apps/*"
  - "packages/*"
overrides:
  # Pin transitive browserslist-data deps to versions old enough that a
  # supply-chain "minimum release age" check won't flag them as too-fresh.
  node-releases: "2.0.51"
  terser: "5.49.0"
  # Security floors for transitive packages still pinned by Nest 10. These
  # are compatible patch/minor releases and avoid changing framework APIs.
  body-parser: "1.20.9"
  file-type: "21.3.2"
  js-yaml: "4.3.2"
  lodash: "4.18.1"
  multer: "2.5.0"
  nanoid: "3.3.18"
  qs: "6.16.1"
  uuid: "11.1.1"
  postcss: "8.5.25"
  fast-uri: "3.1.9"
  hono: "4.13.11"
  ip-address: "10.7.4"
  # Patched development/build dependencies; keep major-specific APIs where required.
  ws: "8.21.0"
  sharp: "0.35.5"
  "undici@^7": "7.30.1"
  # Security audit 2026-10-29 (docs/security/2026-10-29-audit.md D1).
  "undici@^6": "6.29.1"
  proxy-addr: "2.0.8"
  # ISO security test 2026-11-07: audit --prod moderates (CI fails at moderate).
  "@hono/node-server": "2.1.3"
  postcss-selector-parser: "6.1.5"
  source-map-js: "1.2.2"
  zod: "4.6.6"
  "esbuild@<0.25.0": "0.25.12"
  "esbuild@>=0.27.3 <0.28.1": "0.28.2"
  "image-size@^2": "2.0.3"
  "brace-expansion@^1": "1.1.21"
  "brace-expansion@^4": "5.0.12"
  "brace-expansion@^5": "5.0.12"
allowBuilds:
  '@embedded-postgres/darwin-arm64': true
  '@embedded-postgres/linux-x64': true
  '@nestjs/core': true
  '@prisma/client': true
  '@prisma/engines': true
  # Telemetry postinstall; declined deliberately (see the dev-only rail commit).
  '@scarf/scarf': false
  argon2: true
  esbuild: true
  prisma: true
  sharp: true
  workerd: true
