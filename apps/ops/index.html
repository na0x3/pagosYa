<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>pagosYa — Ops Console</title>
<style>
  :root { color-scheme: light dark; }
  body { font-family: system-ui, sans-serif; max-width: 960px; margin: 40px auto; padding: 0 16px; }
  h1 { font-size: 1.4rem; }
  .muted { color: #6b7280; font-size: 0.9rem; }
  .setup { display: flex; gap: 8px; flex-wrap: wrap; align-items: end; margin-bottom: 24px; padding: 16px; border: 1px solid #e5e7eb; border-radius: 8px; }
  .setup label { display: block; font-size: 0.8rem; margin-bottom: 4px; }
  .setup input { padding: 6px 8px; border: 1px solid #d1d5db; border-radius: 6px; min-width: 220px; }
  button { padding: 6px 12px; border-radius: 6px; border: 1px solid #d1d5db; background: #f9fafb; cursor: pointer; }
  button.primary { background: #111827; color: white; border-color: #111827; }
  button.approve { background: #059669; color: white; border-color: #059669; }
  button.reject { background: #dc2626; color: white; border-color: #dc2626; }
  table { width: 100%; border-collapse: collapse; margin-top: 12px; }
  th, td { text-align: left; padding: 8px; border-bottom: 1px solid #e5e7eb; font-size: 0.9rem; vertical-align: top; }
  #error { color: #dc2626; margin-top: 12px; white-space: pre-wrap; }
  #empty { color: #6b7280; margin-top: 16px; }
</style>
</head>
<body>
  <h1>pagosYa — Ops Console</h1>
  <p class="muted">Internal-only. KYC review queue — approving flips the merchant to ACTIVE and unlocks live keys/payouts for them.</p>

  <div class="setup">
    <div>
      <label for="apiBase">API base URL</label>
      <input id="apiBase" value="http://localhost:3000/v1">
    </div>
    <div>
      <label for="opsSecret">Internal ops secret</label>
      <input id="opsSecret" type="password" placeholder="INTERNAL_OPS_SECRET">
    </div>
    <button class="primary" id="connect">Connect &amp; refresh</button>
  </div>

  <div id="error"></div>
  <div id="empty" style="display:none">No submissions pending review.</div>
  <table id="table" style="display:none">
    <thead>
      <tr>
        <th>Merchant</th>
        <th>Settlement</th>
        <th>Legal name / NIT</th>
        <th>Legal rep</th>
        <th>Payout account</th>
        <th>Submitted</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody id="rows"></tbody>
  </table>

<script>
  const apiBaseEl = document.getElementById("apiBase");
  const opsSecretEl = document.getElementById("opsSecret");
  const errorEl = document.getElementById("error");
  const emptyEl = document.getElementById("empty");
  const tableEl = document.getElementById("table");
  const rowsEl = document.getElementById("rows");

  apiBaseEl.value = sessionStorage.getItem("pagosya_ops_api_base") || apiBaseEl.value;
  opsSecretEl.value = sessionStorage.getItem("pagosya_ops_secret") || "";

  async function api(path, options = {}) {
    const res = await fetch(apiBaseEl.value.replace(/\/$/, "") + path, {
      ...options,
      headers: {
        "content-type": "application/json",
        authorization: "Bearer " + opsSecretEl.value,
        ...(options.headers || {}),
      },
    });
    const body = await res.json().catch(() => null);
    if (!res.ok) throw new Error((body && body.message) || res.statusText);
    return body;
  }

  function esc(s) {
    return String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  }

  async function refresh() {
    errorEl.textContent = "";
    sessionStorage.setItem("pagosya_ops_api_base", apiBaseEl.value);
    sessionStorage.setItem("pagosya_ops_secret", opsSecretEl.value);

    try {
      const pending = await api("/merchants/kyc/pending");
      if (pending.length === 0) {
        tableEl.style.display = "none";
        emptyEl.style.display = "block";
        return;
      }
      emptyEl.style.display = "none";
      tableEl.style.display = "table";
      rowsEl.innerHTML = pending
        .map(
          (s) => `
        <tr data-id="${esc(s.id)}">
          <td><strong>${esc(s.merchant.name)}</strong><br><span class="muted">${esc(s.merchant.email)}</span></td>
          <td>${esc(s.merchant.settlementMode)}</td>
          <td>${esc(s.legalName)}<br><span class="muted">${esc(s.taxId)}</span></td>
          <td>${esc(s.legalRepName)}<br><span class="muted">${esc(s.legalRepDocumentId)}</span></td>
          <td>${esc(s.payoutBankAccount)}</td>
          <td>${esc(new Date(s.createdAt).toLocaleString())}</td>
          <td>
            <button class="approve" data-action="approve">Approve</button>
            <button class="reject" data-action="reject">Reject</button>
          </td>
        </tr>`,
        )
        .join("");
    } catch (err) {
      errorEl.textContent = "Error: " + err.message;
      tableEl.style.display = "none";
      emptyEl.style.display = "none";
    }
  }

  rowsEl.addEventListener("click", async (e) => {
    const button = e.target.closest("button[data-action]");
    if (!button) return;
    const id = button.closest("tr").dataset.id;
    const action = button.dataset.action;

    try {
      if (action === "approve") {
        await api(`/merchants/kyc/${id}/review`, { method: "POST", body: JSON.stringify({ decision: "APPROVED" }) });
      } else {
        const note = prompt("Rejection reason (shown to the merchant):") || undefined;
        await api(`/merchants/kyc/${id}/review`, { method: "POST", body: JSON.stringify({ decision: "REJECTED", note }) });
      }
      await refresh();
    } catch (err) {
      errorEl.textContent = "Error: " + err.message;
    }
  });

  document.getElementById("connect").addEventListener("click", refresh);
  if (opsSecretEl.value) refresh();
</script>
</body>
</html>
