<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Producto — Bruma</title>
  <meta name="description" content="Consulta el producto Bruma, elige el volumen disponible y añádelo a tu pedido para recogida.">
  <link rel="stylesheet" href="commerce-pages.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="product-page">
  <header class="site-header">
    <div class="header-primary">
      <a class="wordmark" href="index.html" aria-label="Bruma, inicio" data-store-name>Bruma</a>
      <button class="cart-trigger" type="button" data-cart-open>
        <img src="assets/icons/shopping-bag.svg" alt="">
        <span>Mi pedido</span>
        <span class="cart-count" data-cart-count>0</span>
      </button>
    </div>
    <nav class="site-nav" aria-label="Navegación principal">
      <a href="index.html#catalogo">Productos</a>
      <a href="index.html#criterio-volumen">Cómo elegir</a>

  </header>

  <main class="product-main">
    <a class="back-link" href="index.html#catalogo"><img src="assets/icons/arrow-left.svg" alt=""> Volver al mostrador</a>
    <div data-pagosya-product-page></div>
  </main>

  <div data-pagosya-contact hidden></div>
  <div data-pagosya-cart hidden></div>
  <div class="global-status" data-pagosya-status role="status" aria-live="polite"></div>

  <footer class="site-footer">
    <a class="wordmark" href="index.html">Bruma</a>
    <p>Cuidado cosmético diario en varios volúmenes.</p>
    <a href="index.html#catalogo">Ver productos →</a>

  <script src="config.js" defer></script><script src="commerce.js" defer></script><script src="site.js" defer></script>
