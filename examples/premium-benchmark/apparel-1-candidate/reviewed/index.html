<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Trama — Prendas cotidianas en colores y tallas</title>
  <meta name="description" content="Camisas y camisetas cotidianas de Trama. Elige color, talla y añade tu prenda al pedido.">
  <link rel="stylesheet" href="commerce-pages.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="home-page">
  <header class="site-header">
    <a class="wordmark" href="index.html" aria-label="Trama, inicio">TRAMA</a>
    <nav class="site-nav" aria-label="Navegación principal">
      <a href="#catalogo-muestrario" aria-current="page">Prendas</a>
      <button class="cart-trigger" type="button" data-cart-open>
        <img src="assets/icons/shopping-bag.svg" alt="">
        <span>Mi pedido</span>
        <span class="cart-count" data-cart-count>0</span>
      </button>
    </nav>
  </header>

  <main>
    <section id="catalogo-muestrario" aria-labelledby="catalog-title">
      <div class="catalog-heading">
        <div>
          <p class="eyebrow">Muestrario 01 · prendas cotidianas</p>
          <h1 id="catalog-title">Elige tu trama.</h1>
        </div>
        <p class="catalog-intro">Dos prendas esenciales, presentadas por color y talla.</p>
      </div>
      <div data-pagosya-categories aria-label="Categorías"></div>
      <div class="catalog-status" data-pagosya-status role="status" aria-live="polite"></div>
      <div class="editorial-catalog" data-pagosya-catalog></div>
    </section>

    <section id="nota-trama" aria-labelledby="nota-title">
      <p class="eyebrow">Nota de colección</p>
      <h2 id="nota-title">Algodón, cuello clásico, manga larga; o una camiseta de cuello redondo.</h2>
      <a class="text-link" href="#catalogo-muestrario">Volver a las prendas <img src="assets/icons/arrow-right.svg" alt=""></a>
    </section>
  </main>

  <template data-pagosya-product-template>
    <article class="sample-sheet">
      <div class="sheet-register" aria-hidden="true"><span></span><span></span></div>
      <div class="sheet-copy">
        <p class="sheet-kicker">TRAMA · PRENDA</p>
        <h2><a data-product-link data-product-field="name"></a></h2>
        <p class="sheet-description" data-product-field="description"></p>
      </div>
      <div class="sheet-purchase">
        <div class="sheet-price" data-product-field="price"></div>
        <div class="sheet-options" data-product-field="options"></div>
        <div class="sheet-actions">
          <a class="details-link" data-product-link>Ver prenda <img src="assets/icons/arrow-right.svg" alt=""></a>
          <button class="menu-add" type="button" data-product-add>Añadir al pedido</button>
        </div>
      </div>
    </article>
  </template>

  <div data-pagosya-cart hidden></div>
  <div data-pagosya-contact hidden></div>

  <footer class="site-footer">
    <a class="wordmark wordmark--footer" href="index.html">TRAMA</a>
    <p>Prendas cotidianas con colores y tallas.</p>
    <a href="#catalogo-muestrario">Prendas</a>
  </footer>

  <script src="config.js" defer></script><script src="commerce.js" defer></script><script src="site.js" defer></script>
</body>
</html>
