<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Producto — Bruma</title>
  <meta name="description" content="Consulta los volúmenes disponibles, ajusta la cantidad y añade tu producto Bruma al pedido.">
  <link rel="stylesheet" href="commerce-pages.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="product-page">
  <header class="site-header">
    <div class="header-brand">
      <a class="wordmark" href="index.html">Bruma</a>
      <p>Cuidado cosmético diario<br>en varios volúmenes</p>
    </div>
    <div class="header-actions">
      <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="site-nav">
        <img src="assets/icons/menu.svg" alt=""> <span>Menú</span>
      </button>
      <nav class="site-nav" id="site-nav" aria-label="Navegación principal">
        <a href="index.html#catalogo-mostador">Productos</a>
        <a href="index.html#nota-cotidiana">Bruma</a>
      </nav>
      <button class="cart-trigger" type="button" data-cart-open>
        <img src="assets/icons/shopping-bag.svg" alt="">
        <span>Mi pedido · <span data-cart-count>0</span></span>
      </button>
    </div>
  </header>

  <main class="product-main">
    <a class="back-link" href="index.html#catalogo-mostador"><img src="assets/icons/arrow-left.svg" alt=""> Volver al mostrador</a>
    <div data-pagosya-product-page></div>
  </main>

  <div class="runtime-status" data-pagosya-status role="status" aria-live="polite"></div>
  <div data-pagosya-cart hidden></div>
  <div data-pagosya-contact hidden></div>

  <footer class="site-footer">
    <a class="footer-mark" href="index.html">Bruma</a>
    <p>Cuidado cosmético diario en varios volúmenes.</p>
    <button type="button" class="footer-cart" data-cart-open>Mi pedido · <span data-cart-count>0</span></button>
  </footer>

  <script src="config.js" defer></script><script src="commerce.js" defer></script><script src="site.js" defer></script>
</body>
</html>
