<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Pliegue · Fundas de lino y mantas de algodón</title>
  <meta name="description" content="Fundas de cojín de lino en dos tamaños y una manta tejida de algodón. Elige tu pieza y retírala en tienda.">
  <link rel="stylesheet" href="commerce-pages.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="site-header">
  <a class="wordmark" href="index.html" aria-label="Pliegue, inicio" data-store-name>Pliegue</a>
  <button class="menu-toggle" type="button" aria-label="Abrir navegación" aria-expanded="false" aria-controls="site-nav"><img src="assets/icons/menu.svg" alt=""></button>
  <nav id="site-nav" class="site-nav" aria-label="Navegación principal">
    <a href="#textiles">Textiles</a><a href="#de-cerca">De cerca</a>
  </nav>
  <button class="cart-trigger" type="button" data-cart-open aria-label="Abrir Mi pedido"><span>Mi pedido</span><b data-cart-count>0</b></button>
</header>
<main>
  <section id="textiles" class="opening" aria-labelledby="hero-title">
    <h1 id="hero-title">Lino y algodón, para el sofá.</h1>
    <div class="opening-note">
      <p>Fundas de cojín de lino en dos tamaños y una manta de algodón tejido. Eliges tu pieza aquí y la retiras en tienda.</p>
      <p class="opening-meta">Precios en bolivianos</p>
    </div>
    <div data-pagosya-catalog aria-live="polite"></div>
  </section>

  <section id="de-cerca" class="closeup" aria-labelledby="closeup-title">
    <h2 id="closeup-title">De cerca</h2>
    <div class="closeup-grid">
      <figure class="swatch">
        <div class="swatch-crop pinked"><img src="assets/image-bfa86d664066.jpg" alt="Trama del lino de la funda, en primer plano" style="object-position:80% 18%"></div>
        <figcaption><h3>Lino</h3><p>Funda de lino con cierre oculto. Se vende sin relleno.</p><a href="#textiles">Elegir tamaño</a></figcaption>
      </figure>
      <figure class="swatch">
        <div class="swatch-crop pinked"><img src="assets/image-f5d075124660.jpg" alt="Flecos y tejido de la manta de algodón, en primer plano" style="object-position:40% 80%"></div>
        <figcaption><h3>Algodón tejido</h3><p>Manta tejida de algodón para el sofá, con flecos en los extremos.</p><a href="#textiles">Elegir color</a></figcaption>
      </figure>
    </div>
  </section>
</main>

<template data-pagosya-product-template>
  <article class="product-card">
    <a class="product-media" data-product-link data-product-media><img data-product-field="image" alt=""></a>
    <div class="product-copy">
      <h3><a data-product-link data-product-field="name"></a></h3>
      <span class="product-price" data-product-field="price"></span>
      <p class="product-description" data-product-field="description"></p>
      <div class="product-buy"><div class="product-options" data-product-field="options"></div><button class="menu-add" type="button" data-product-add>Añadir al pedido</button><a class="detail-link" data-product-link>Ver detalles</a></div>
    </div>
  </article>
</template>
<div data-pagosya-cart hidden></div>
<div class="global-status" data-pagosya-status role="status" aria-live="polite"></div>
<div data-pagosya-contact hidden></div>
<footer class="site-footer"><a class="footer-mark" href="index.html">Pliegue</a><p>Textiles de hogar. Retiro en tienda.</p><button type="button" data-cart-open>Mi pedido <span data-cart-count>0</span></button></footer>
<script src="config.js" defer></script><script src="commerce.js" defer></script><script src="site.js" defer></script>
</body>
</html>
