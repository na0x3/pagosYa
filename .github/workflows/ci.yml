name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # The API's *.integration.spec.ts suites deliberately refuse to report
    # success in CI without a database — a skipped suite exits 0, and they exist
    # precisely because the mocked suites cannot catch what they catch. Each one
    # CREATEs a throwaway database of its own and DROPs it, so this service is
    # all they need.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pagosya
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      INTEGRATION_TEST_ADMIN_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check architecture boundaries
        run: pnpm check:boundaries

      - name: Generate Prisma client
        run: pnpm --filter @pagosya/api exec prisma generate

      - name: Audit production dependencies
        run: |
          pnpm audit --prod --audit-level moderate
          npm audit --omit=dev --package-lock-only --audit-level=moderate --prefix apps/matcho-showcase

      - name: Build
        run: pnpm build

      # Type-aware, so it runs after the Prisma client and workspace builds exist.
      # Errors fail the build; the warning backlog stays visible for burn-down.
      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

  browser-tests:
    name: Customer shopping and merchant publishing (Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @pagosya/merchant-studio exec playwright install --with-deps chromium
      # The whole Studio suite, not a five-file subset. 32 of its 37 spec files
      # were never run here despite passing: 177 of 178 tests green as of
      # 2026-09-22, and fhasin-repair.local.spec.ts skips itself when its local
      # snapshot is absent. Runs in about 4 minutes.
      - name: Test Studio (full suite)
        run: pnpm --filter @pagosya/merchant-studio exec playwright test
      - run: pnpm --filter @pagosya/merchant-dashboard run build:studio
      # Every dashboard spec file runs here. As of 2026-09-24 the whole suite
      # is green locally (72 passed, 1 intentional skip), merchant-workspace
      # included.
      - name: Test merchant navigation, settings, and account access
        run: pnpm --filter @pagosya/merchant-dashboard exec playwright test tests/merchant-workspace.spec.mjs tests/auth-account.spec.mjs tests/consumer-auth-account.spec.mjs tests/store-settings.spec.mjs tests/domain-shop.spec.mjs tests/international-payments.spec.mjs tests/dashboard-smoke.spec.mjs tests/rewards.spec.mjs tests/merchant-levels.spec.mjs tests/terms-acceptance.spec.mjs tests/shipment-panel.spec.mjs tests/single-store.spec.mjs tests/blob-characters.spec.mjs --workers=1
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: shopping-browser-results
          path: |
            apps/merchant-studio/test-results/
            apps/merchant-studio/playwright-report/
            apps/merchant-dashboard/test-results/
          retention-days: 7

  migration-safety:
    name: Migration safety (apply against pre-existing data)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # pnpm test's Jest suites all mock PrismaService, so they never actually
    # run `prisma migrate deploy` against a real database — this job exists
    # because that gap let a real bug through once already: a migration that
    # added a NOT NULL column with no backfill, which only breaks once a
    # table already has rows (an empty CI database would never catch it).
    # Simulate that by seeding data on the base branch's schema first, then
    # applying this branch's new migrations on top of it, same as upgrading
    # a real deployment.
    if: github.event_name == 'pull_request'
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pagosya
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/pagosya?schema=public
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies (PR branch)
        run: pnpm install --frozen-lockfile

      - name: Check out base branch into a worktree
        run: git worktree add /tmp/base-ref ${{ github.event.pull_request.base.sha }}

      - name: Apply base-branch migrations and seed representative data
        working-directory: /tmp/base-ref/apps/api
        run: |
          pnpm install --frozen-lockfile
          pnpm exec prisma generate
          pnpm exec prisma migrate deploy
          pnpm exec ts-node prisma/seed.ts

      - name: Apply this PR's migrations on top of that pre-existing data
        working-directory: apps/api
        run: |
          pnpm exec prisma generate
          pnpm exec prisma migrate deploy

      - name: Run the test suite against the upgraded, pre-populated database
        working-directory: apps/api
        run: pnpm test
