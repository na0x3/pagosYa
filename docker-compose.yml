services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: pagosya
    ports:
      # Development database only: never expose the default local credentials
      # on LAN/public interfaces.
      - "127.0.0.1:54329:5432"
    security_opt:
      - no-new-privileges:true
    volumes:
      - pagosya_pgdata:/var/lib/postgresql/data

volumes:
  pagosya_pgdata:
