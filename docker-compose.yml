services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: pagosya
    ports:
      - "54329:5432"
    volumes:
      - pagosya_pgdata:/var/lib/postgresql/data

volumes:
  pagosya_pgdata:
